# 협업 규칙 §7 CI 파이프라인.
#   PR(→ develop, → main), develop push : 린트(Go · OpenAPI) · 테스트 · 빌드 + 이미지 빌드 (push 안 함)
#   main push(머지)             : 같은 검사 → 릴리스 버전 계산 → 이미지 push  ghcr.io/devoops-team/backend:{X.Y.Z, X.Y, main, sha-<7자리>}
#                                 → 버전 봇이 태그 vX.Y.Z · Release 생성 → 배포 봇이 Gitops overlay에 X.Y.Z@digest 반영
#   버전 · description은 develop → main PR 본문의 '## 릴리스 노트'에서 나온다 (GPU-136, 형식은 .github/pull_request_template.md).
#   main 머지 커밋이 PR 머지가 아니거나 릴리스 노트가 없으면 이미지 push · 배포를 하지 않는다.
#   trainer 이미지(ghcr.io/devoops-team/trainer)는 Data 레포 trainer/에서 빌드 · 배포한다 (GPU-154)
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/devoops-team/backend

jobs:
  # 버전 계산 (main push에서만 release=true). 로직은 Gitops 재사용 워크플로.
  plan:
    name: version
    uses: DevOops-Team/Gitops/.github/workflows/release-plan.yml@main
    permissions:
      contents: read
      pull-requests: read

  check:
    name: lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@2.11.0 lint api/openapi.yaml
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...

  image:
    name: image
    needs: [check, plan]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.IMAGE }}
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }},enable=${{ env.PUSH }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.version }},enable=${{ env.PUSH }}
            type=raw,value=main
            type=sha,prefix=sha-,format=short
          labels: |
            ${{ env.PUSH == 'true' && format('org.opencontainers.image.description={0}', needs.plan.outputs.description) || '' }}
          annotations: |
            ${{ env.PUSH == 'true' && format('org.opencontainers.image.description={0}', needs.plan.outputs.description) || '' }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GPU-136: 이미지 push가 끝난 뒤 버전 봇이 태그 vX.Y.Z · Release를 만든다.
  #   Variable VERSION_APP_ID, 비밀키는 Environment release(main만)의 Secret VERSION_APP_PRIVATE_KEY.
  release:
    name: release
    needs: [plan, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true'
    uses: DevOops-Team/Gitops/.github/workflows/release-publish.yml@main
    with:
      tag: ${{ needs.plan.outputs.tag }}
      notes: ${{ needs.plan.outputs.notes }}
      app-id: ${{ vars.VERSION_APP_ID }}
    secrets:
      VERSION_APP_PRIVATE_KEY: ${{ secrets.VERSION_APP_PRIVATE_KEY }}   # 이름으로 넘김 — 값은 Environment release(main만)

  # GPU-114 · ADR-23: main 이미지 X.Y.Z@digest를 Gitops overlay에 반영한다.
  # 로직은 Gitops 재사용 워크플로 한 곳에 있다. 값은 Variables(DEPLOY_APP_ID · GITOPS_REPO · GITOPS_OVERLAY),
  # 비밀키는 Environment gitops-deploy(main만)의 Secret DEPLOY_APP_PRIVATE_KEY (GPU-136).
  deploy:
    name: gitops deploy
    needs: [plan, image, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true'
    uses: DevOops-Team/Gitops/.github/workflows/update-image.yml@main
    with:
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      version: ${{ needs.plan.outputs.version }}
      overlay: ${{ vars.GITOPS_OVERLAY }}
      app-id: ${{ vars.DEPLOY_APP_ID }}
      gitops-repo: ${{ vars.GITOPS_REPO }}
    secrets:
      DEPLOY_APP_PRIVATE_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}     # 이름으로 넘김 — 값은 Environment gitops-deploy(main만)
