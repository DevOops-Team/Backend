# 협업 규칙 §7 CI 파이프라인.
#   PR(→ develop, → main), develop push : 린트(Go · OpenAPI) · 테스트 · 빌드 + 이미지 빌드 (push 안 함)
#   main push(머지)             : 같은 검사 → 이미지 push  ghcr.io/devoops-team/backend:{main, sha-<7자리>}
#   trainer 이미지(ghcr.io/devoops-team/trainer)는 Data 레포 trainer/에서 빌드 · 배포한다 (GPU-154)
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/devoops-team/backend

jobs:
  check:
    name: lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@2.11.0 lint api/openapi.yaml
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...

  image:
    name: image
    needs: check
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.IMAGE }}
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GPU-114 · ADR-23: main 이미지 digest를 Gitops overlay에 반영한다.
  # 로직은 Gitops 재사용 워크플로 한 곳에 있다. 값은 Variables(DEPLOY_APP_ID · GITOPS_REPO · GITOPS_OVERLAY)와
  # Secret(DEPLOY_APP_PRIVATE_KEY)에서 받고, digest는 image job 출력을 쓴다.
  deploy:
    name: gitops deploy
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: DevOops-Team/Gitops/.github/workflows/update-image.yml@main
    with:
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      overlay: ${{ vars.GITOPS_OVERLAY }}
      app-id: ${{ vars.DEPLOY_APP_ID }}
      gitops-repo: ${{ vars.GITOPS_REPO }}
    secrets:
      app-private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
