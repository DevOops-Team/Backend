openapi: 3.0.3
info:
  title: DevOops Backend API
  version: 0.2.0
  description: |
    학습 작업을 제출하고 진행 상태를 보는 API. Confluence `서비스 API 명세`를 따른다.

    - 프론트는 모델 · 데이터셋 목록의 기본값으로 요청을 채워 `POST /api/jobs`로 제출한다. 기본값과 범위는 `GET /api/models`가 준다.
    - 필드 이름은 camelCase다. `hyperparameters` · `config` 안은 config.json 키 그대로 snake_case다.
    - 오류 응답은 `{"error", "code", "fields"}`다. 400은 입력 오류, 502는 S3 · k3s · DynamoDB 오류다.
    - 이 파일은 손으로 관리한다. 라우트를 바꾸면 `internal/handler/router.go`와 함께 고친다(테스트가 Gin 라우트와 이 파일을 비교한다).

    **임시 구성 (FSDP 연동 테스트)**: 서비스 DB가 없어 상태는 k3s, 설정은 S3, 나머지는 JobSet 어노테이션에서 읽는다. 데이터셋은 등록 API 없이 S3의 `manifest.json`에서 읽는다.
    목록의 `limit` · `cursor`, `generations`, `cancel`은 아직 없다. 모델 파일 목록과 두 미리보기 API는 화면에서 내용을 보기 위해 명세에 더했다.
servers:
  - url: /
# 인증 없음 (로컬 · 데모용). 인증이 생기면 securitySchemes와 함께 바꾼다.
security: []
tags:
  - name: models
    description: 학습 모델
  - name: datasets
    description: 학습 데이터
  - name: jobs
    description: 작업 제출 · 조회
  - name: files
    description: 작업이 저장한 파일 보기
  - name: health
    description: 상태 확인

paths:
  /healthz:
    get:
      tags: [health]
      summary: 상태 확인
      operationId: healthz
      responses:
        "200":
          description: 살아 있음
          content:
            text/plain:
              schema: { type: string, example: ok }

  /api/models:
    get:
      tags: [models]
      summary: 모델 · 방식 · GPU 범위 · 하이퍼파라미터 정의와 S3의 모델 파일
      operationId: listModels
      responses:
        "200":
          description: 모델 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Model" }
                  nextCursor: { type: string, nullable: true }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/models/{name}/files/{file}:
    get:
      tags: [models]
      summary: 모델 파일 내용 (앞 64KiB)
      operationId: getModelFile
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, example: gpt2 }
        - name: file
          in: path
          required: true
          description: 파일명 (경로 구분자 없이)
          schema: { type: string, example: config.json }
      responses:
        "200": { $ref: "#/components/responses/FileText" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/datasets:
    get:
      tags: [datasets]
      summary: 데이터셋 목록
      operationId: listDatasets
      responses:
        "200":
          description: 데이터셋 목록 (versions 제외)
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Dataset" }
                  nextCursor: { type: string, nullable: true }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/datasets/{id}:
    get:
      tags: [datasets]
      summary: 데이터셋 상세 + 버전 · 파일 목록
      operationId: getDataset
      parameters:
        - $ref: "#/components/parameters/DatasetID"
      responses:
        "200":
          description: 데이터셋
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/datasets/{id}/versions/{version}/files/{name}:
    get:
      tags: [datasets]
      summary: 데이터 파일 내용 (앞 64KiB)
      operationId: getDatasetFile
      parameters:
        - $ref: "#/components/parameters/DatasetID"
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1, example: 1 }
        - name: name
          in: path
          required: true
          description: 파일명 (경로 구분자 없이)
          schema: { type: string, example: train-000.jsonl }
      responses:
        "200": { $ref: "#/components/responses/FileText" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs:
    post:
      tags: [jobs]
      summary: 작업 제출
      operationId: createJob
      description: |
        검증(실패하면 아무것도 쓰지 않음) → 프로파일 기본값 + 사용자 값 병합 → S3 `code/{id}/config.json` · `train.py` · `jobset.json` 저장 → k3s에 JobSet 제출.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitJobRequest" }
      responses:
        "201":
          description: 제출됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 같은 JobSet 이름이 이미 있음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: 모델이 받지 않는 데이터 형식
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }
    get:
      tags: [jobs]
      summary: 작업 목록 (최신순)
      operationId: listJobs
      description: k3s의 JobSet · Workload 상태에 DynamoDB 진행 상태를 합친다. DynamoDB 조회가 실패해도 큐 상태는 돌려준다(`progress`가 null).
      responses:
        "200":
          description: 작업 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
                  nextCursor: { type: string, nullable: true }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}:
    get:
      tags: [jobs]
      summary: 작업 상세
      operationId: getJob
      description: 목록 항목에 최종 `config`와 사용한 이미지를 더한다.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: 작업
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}/events:
    get:
      tags: [jobs]
      summary: 전달 타임라인 (시간순)
      operationId: listJobEvents
      description: 작업이 GPU까지 가는 동안 거친 단계. k3s 단계는 백엔드가, EKS 단계는 각 워커의 job-watcher가 DynamoDB `devoops-job-events`에 쓴다.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: 이벤트 목록 (없으면 빈 배열)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}/files:
    get:
      tags: [files]
      summary: 작업 파일 목록 (config.json · jobset.json · train.py · 데이터 manifest.json)
      operationId: listJobFiles
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: 파일 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/File" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}/files/{kind}/{name}:
    get:
      tags: [files]
      summary: 파일 내용 (앞 64KiB)
      operationId: getJobFile
      description: "`data`는 `manifest.json`만 된다. 체크포인트는 보여 주지 않는다."
      parameters:
        - $ref: "#/components/parameters/JobID"
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [code, data] }
        - name: name
          in: path
          required: true
          description: 파일명 (경로 구분자 없이)
          schema: { type: string, example: config.json }
      responses:
        "200": { $ref: "#/components/responses/FileText" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

components:
  parameters:
    JobID:
      name: id
      in: path
      required: true
      description: 작업 ID (백엔드가 만든 8자리 hex)
      schema: { type: string, pattern: "^[0-9a-z]+$", example: 3f9a1c2e }
    DatasetID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^ds-[a-z0-9-]+$", example: ds-tiny-shakespeare }

  responses:
    FileText:
      description: 파일 앞부분
      headers:
        X-Truncated:
          description: 64KiB에서 잘렸으면 true
          schema: { type: boolean }
        X-Total-Size:
          description: 전체 크기 (바이트)
          schema: { type: integer, format: int64 }
      content:
        text/plain:
          schema: { type: string }
    BadRequest:
      description: 입력 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            gpus:
              value:
                error: "invalid request: gpus: 2~2"
                code: VALIDATION
                fields: [{ field: gpus, message: "2~2" }]
    NotFound:
      description: 없음
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: S3 · k3s · DynamoDB 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [VALIDATION, NOT_FOUND, ALREADY_EXISTS, DATASET_FORMAT_MISMATCH, SUBMIT_FAILED, UPSTREAM, INTERNAL]
        fields:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: gpus }
              message: { type: string, example: "2~2" }

    GPURange:
      type: object
      required: [min, max, default, options]
      properties:
        min: { type: integer }
        max: { type: integer, description: 현재 GPU 할당량으로 쓸 수 있는 최대 개수. options 중 이보다 큰 값은 아직 고를 수 없다 }
        options:
          type: array
          description: 서비스가 제공하는 GPU 수
          items: { type: integer }
          example: [1, 2, 4]
        default: { type: integer, description: 입력하지 않았을 때 프론트가 보내는 값 }

    StoredFile:
      type: object
      required: [name, size]
      properties:
        name: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }

    Model:
      type: object
      required: [name, displayName, strategies, defaultStrategy, gpus, datasetFormats, hyperparameters, uri, files]
      properties:
        name: { type: string, example: gpt2 }
        displayName: { type: string, example: GPT-2 small }
        strategies:
          type: array
          items: { type: string, example: fsdp }
        defaultStrategy: { type: string, example: fsdp }
        strategyMinGpus:
          type: object
          description: 방식별 최소 GPU 수
          additionalProperties: { type: integer }
          example: { fsdp: 2, ddp: 1 }
        gpus: { $ref: "#/components/schemas/GPURange" }
        datasetFormats:
          type: array
          items: { type: string, example: text-jsonl }
        hyperparameters:
          type: array
          items:
            type: object
            required: [key, level, type, default]
            properties:
              key: { type: string, example: epochs }
              level: { type: string, enum: [basic, advanced] }
              type: { type: string, enum: [integer, number] }
              default: { type: number, example: 10 }
              min: { type: number }
              exclusiveMin: { type: number }
              max: { type: number }
        uri: { type: string, example: "s3://devoops-ml-example/datasets/_shared/models/gpt2/" }
        files:
          type: array
          items: { $ref: "#/components/schemas/StoredFile" }

    Dataset:
      type: object
      required: [id, name, format, latestVersion]
      properties:
        id: { type: string, example: ds-tiny-shakespeare }
        name: { type: string, example: Tiny Shakespeare }
        format: { type: string, example: text-jsonl }
        latestVersion: { type: integer, example: 1 }
        versions:
          type: array
          description: 상세에만 있다
          items:
            type: object
            required: [version, source, uri, fileCount, totalBytes, manifestSha256, files]
            properties:
              version: { type: integer }
              source: { type: string, example: seed }
              uri: { type: string }
              fileCount: { type: integer }
              totalBytes: { type: integer, format: int64 }
              manifestSha256: { type: string }
              files:
                type: array
                items: { $ref: "#/components/schemas/StoredFile" }

    SubmitJobRequest:
      type: object
      required: [model, gpus, dataset]
      additionalProperties: false
      properties:
        name: { type: string, description: "1~63자, 소문자 · 숫자 · `-`. 없으면 `{model}-{id}`", example: gpt2-demo }
        model: { type: string, example: gpt2 }
        strategy: { type: string, description: 없으면 모델의 defaultStrategy, example: fsdp }
        gpus: { type: integer, example: 2 }
        dataset:
          type: object
          required: [id, version]
          properties:
            id: { type: string, example: ds-tiny-shakespeare }
            version: { type: integer, example: 1 }
        hyperparameters:
          type: object
          description: 모델이 연 키만. 비우면 프로파일 기본값
          additionalProperties: true
          example: {}

    TrainConfig:
      type: object
      description: 최종 config.json. 키는 snake_case 그대로다.
      required: [schema_version, model, training_mode, checkpoint_format, dataset, epochs, max_steps, batch_size_per_gpu, learning_rate, warmup_steps, checkpoint_every_steps, seed, world_size]
      properties:
        schema_version: { type: integer, example: 1 }
        model: { type: string, example: gpt2 }
        training_mode: { type: string, example: fsdp }
        checkpoint_format: { type: string, example: fsdp-dcp }
        dataset:
          type: object
          required: [uri, format, manifest_sha256]
          properties:
            uri: { type: string }
            format: { type: string, example: text-jsonl }
            manifest_sha256: { type: string }
        epochs: { type: integer, example: 10 }
        max_steps: { type: integer, nullable: true }
        batch_size_per_gpu: { type: integer, example: 4 }
        learning_rate: { type: number, example: 0.00003 }
        warmup_steps: { type: integer, example: 100 }
        checkpoint_every_steps: { type: integer, nullable: true, example: 250 }
        seed: { type: integer, example: 42 }
        world_size: { type: integer, example: 2 }

    CreatedJob:
      type: object
      required: [id, name, status, generation, jobsetName, queue, config, configSha256, createdAt]
      properties:
        id: { type: string, example: 3f9a1c2e }
        name: { type: string, example: gpt2-demo }
        status: { $ref: "#/components/schemas/Status" }
        generation: { type: integer, example: 1 }
        jobsetName: { type: string, example: job-3f9a1c2e-g0001 }
        queue: { type: string, example: queue-auto }
        config: { $ref: "#/components/schemas/TrainConfig" }
        configSha256: { type: string }
        createdAt: { type: string, format: date-time }

    Status:
      type: string
      enum: [QUEUED, ADMITTED, RUNNING, SUCCEEDED, FAILED]
      description: 화면에 쓰는 작업 상태. 임시 구성에서는 복구가 없어 RECOVERING · REJECTED · CANCELLED가 없다.

    Phase:
      type: string
      enum: [Pending, Admitted, Running, Succeeded, Failed]
      description: |
        현재 세대의 k3s 상태.
        - Pending: 큐에서 승인 대기
        - Admitted: 워커가 쿼터를 잡음
        - Running: active Pod가 있음
        - Succeeded / Failed: JobSet condition 기준

    Job:
      type: object
      required: [id, name, model, strategy, gpus, status, generation, jobsetName, queue, phase, recoveryCount, createdAt, updatedAt, progress]
      properties:
        id: { type: string }
        name: { type: string }
        model: { type: string }
        strategy: { type: string }
        gpus: { type: integer }
        status: { $ref: "#/components/schemas/Status" }
        statusMessage: { type: string, description: 대기 이유 등 Kueue 메시지 }
        generation: { type: integer }
        jobsetName: { type: string }
        queue: { type: string }
        cluster: { type: string, description: MultiKueue가 고른 EKS. 아직 없으면 생략, example: devoops-a }
        phase: { $ref: "#/components/schemas/Phase" }
        dataset:
          type: object
          required: [id, version]
          properties:
            id: { type: string }
            version: { type: integer }
            format: { type: string }
            manifestSha256: { type: string }
        hyperparameters: { type: object, additionalProperties: true, description: 사용자가 바꾼 값 }
        configSha256: { type: string }
        recoveryCount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        config: { $ref: "#/components/schemas/TrainConfig" }
        images: { type: object, additionalProperties: { type: string } }
        progress:
          description: train.py가 처음 쓰기 전에는 null
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Progress"

    Progress:
      type: object
      required: [status, generation, step, totalSteps, loss, lastCheckpointStep, updatedAt]
      properties:
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        generation: { type: integer, format: int64 }
        step: { type: integer, format: int64 }
        totalSteps: { type: integer, format: int64 }
        loss: { type: number, format: double }
        lastCheckpointStep: { type: integer, format: int64 }
        nodeName: { type: string }
        updatedAt: { type: string, format: date-time }

    JobEvent:
      type: object
      required: [jobId, key, time, lastTime, cluster, source, reason, message, type, object, count]
      properties:
        jobId: { type: string }
        key: { type: string, description: "정렬 키 `<시각 ms UTC>#<클러스터>#<ID>`. 반복 이벤트는 같은 키를 덮어쓴다" }
        time: { type: string, format: date-time, description: 처음 본 시각 }
        lastTime: { type: string, format: date-time, description: 마지막으로 본 시각 }
        cluster: { type: string, description: "`k3s` 또는 EKS 워커 이름" }
        source: { type: string, description: "backend, kueue-admission, multikueue, jobset, default-scheduler, karpenter, kubelet, ..." }
        reason: { type: string }
        message: { type: string }
        type: { type: string, enum: [Normal, Warning] }
        object: { type: string, description: "이벤트 대상 `Kind/name`" }
        count: { type: integer, format: int64 }

    File:
      type: object
      required: [kind, name, size]
      properties:
        kind: { type: string, enum: [code, data], description: "code = config.json · jobset.json · train.py, data = 데이터 manifest.json" }
        name: { type: string }
        size: { type: integer, format: int64 }
