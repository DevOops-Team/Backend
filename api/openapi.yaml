openapi: 3.0.3
info:
  title: DevOops Backend API
  version: 0.3.0
  description: |
    학습 작업을 제출하고 진행 상태를 보는 API. Confluence `서비스 API 명세`를 따른다.

    - 프론트는 로컬의 Hugging Face 모델 폴더 · jsonl 학습 데이터와 설정을 `POST /api/jobs`(multipart)로 제출한다. 기본값과 범위는 `GET /api/training/options`가 준다.
    - 필드 이름은 camelCase다. `hyperparameters` · `config` 안은 config.json 키 그대로 snake_case다.
    - 오류 응답은 `{"error", "code", "fields"}`다. 400은 입력 오류, 413은 업로드 상한 초과, 502는 S3 · 관리 클러스터 · DynamoDB(펜싱) 오류다.
    - 이 파일은 손으로 관리한다. 라우트를 바꾸면 `internal/handler/router.go`와 함께 고친다(테스트가 Gin 라우트와 이 파일을 비교한다).

    서비스 DB가 없어 상태는 관리 클러스터(Kueue · JobSet), 설정은 S3, 나머지는 JobSet 어노테이션에서 읽는다. 제출 기록은 Kafka `job.lifecycle`(`job.submitted`)로 보낸다.
    목록의 `limit` · `cursor`, `generations`, `cancel`은 아직 없다.
servers:
  - url: /
# 인증 없음 (로컬 · 데모용). 인증이 생기면 securitySchemes와 함께 바꾼다.
security: []
tags:
  - name: training
    description: 제출 화면이 고를 수 있는 값
  - name: jobs
    description: 작업 제출 · 조회
  - name: files
    description: 작업이 저장한 파일 보기
  - name: health
    description: 상태 확인

paths:
  /healthz:
    get:
      tags: [health]
      summary: 상태 확인
      operationId: healthz
      responses:
        "200":
          description: 살아 있음
          content:
            text/plain:
              schema: { type: string, example: ok }

  /api/training/options:
    get:
      tags: [training]
      summary: 방식 · GPU 범위 · 하이퍼파라미터 정의 · 업로드 상한 · 체크포인트 계산 기본값
      operationId: getTrainingOptions
      responses:
        "200":
          description: 제출 화면 옵션
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingOptions" }

  /api/jobs:
    post:
      tags: [jobs]
      summary: 작업 제출
      operationId: createJob
      description: |
        multipart/form-data. 첫 파트는 `spec`(JSON), 이어서 파일 파트를 보낸다. 파일 경로는 파트 **이름**에 넣는다(파일명은 기본 이름만 남기 때문).
        - `model/<폴더명>/<폴더 안 경로>`: Hugging Face 모델 폴더의 파일 전부 (`config.json` 필수, 한 폴더만)
        - `data/<파일명>.jsonl`: 학습 데이터 (한 줄에 `{"text": ...}`), 1개 이상

        처리: spec 검증(실패하면 아무것도 읽지 · 쓰지 않음) → 파일을 S3 `datasets/{id}/v1/{model,data}/`로 스트리밍(sha256 · 크기 계산, 상한 초과 시 413) → `manifest.json` → 체크포인트 간격 계산(Young/Daly) → `code/{id}/config.json` · `jobset.json` → DynamoDB 펜싱 첫 항목 → JobSet 제출 → Kafka `job.submitted`(최선 노력).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [spec]
              properties:
                spec: { $ref: "#/components/schemas/SubmitSpec" }
              additionalProperties:
                type: string
                format: binary
                description: "`model/<폴더>/<경로>` 또는 `data/<파일>.jsonl`"
      responses:
        "201":
          description: 제출됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: 같은 JobSet 이름 · 펜싱 항목이 이미 있음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: 업로드 상한(모델 · 데이터 바이트, 파일 수) 초과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }
    get:
      tags: [jobs]
      summary: 작업 목록 (최신순)
      operationId: listJobs
      description: 관리 클러스터의 JobSet · Workload(이름 · 설정 · 대기 이유)에 Kafka `job.lifecycle` 사건으로 만든 상태 · 워커 · 진행률 · 마지막 체크포인트를 합친다. Backend가 토픽 전체를 읽어 메모리에 들고 있으며, 사건이 없으면(Kafka 장애 · 보존 기간 7일 경과) 관리 클러스터 상태를 그대로 쓴다.
      responses:
        "200":
          description: 작업 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
                  nextCursor: { type: string, nullable: true }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}:
    get:
      tags: [jobs]
      summary: 작업 상세
      operationId: getJob
      description: 목록 항목에 최종 `config`와 사용한 이미지를 더한다.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: 작업
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}/events:
    get:
      tags: [jobs]
      summary: 전달 타임라인 (시간순)
      operationId: listJobEvents
      description: 작업이 GPU까지 가는 동안 거친 단계. 온프레 관리 클러스터(`onprem`) 단계는 백엔드가 Kubernetes Event · Kueue Workload에서 모은다.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: 이벤트 목록 (없으면 빈 배열)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}/files:
    get:
      tags: [files]
      summary: 작업 파일 목록 (config.json · jobset.json · train.py · 데이터 manifest.json)
      operationId: listJobFiles
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: 파일 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/File" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}/files/{kind}/{name}:
    get:
      tags: [files]
      summary: 파일 내용 (앞 64KiB)
      operationId: getJobFile
      description: "`data`는 `manifest.json`만 된다. 체크포인트는 보여 주지 않는다."
      parameters:
        - $ref: "#/components/parameters/JobID"
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [code, data] }
        - name: name
          in: path
          required: true
          description: 파일명 (경로 구분자 없이)
          schema: { type: string, example: config.json }
      responses:
        "200": { $ref: "#/components/responses/FileText" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

components:
  parameters:
    JobID:
      name: id
      in: path
      required: true
      description: 작업 ID (백엔드가 만든 8자리 hex)
      schema: { type: string, pattern: "^[0-9a-z]+$", example: 3f9a1c2e }

  responses:
    FileText:
      description: 파일 앞부분
      headers:
        X-Truncated:
          description: 64KiB에서 잘렸으면 true
          schema: { type: boolean }
        X-Total-Size:
          description: 전체 크기 (바이트)
          schema: { type: integer, format: int64 }
      content:
        text/plain:
          schema: { type: string }
    BadRequest:
      description: 입력 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            gpus:
              value:
                error: "invalid request: gpus: 2~2"
                code: VALIDATION
                fields: [{ field: gpus, message: "2~2" }]
    NotFound:
      description: 없음
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: S3 · 관리 클러스터 · DynamoDB 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [VALIDATION, NOT_FOUND, ALREADY_EXISTS, TOO_LARGE, SUBMIT_FAILED, UPSTREAM, INTERNAL]
        fields:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: gpus }
              message: { type: string, example: "2~2" }

    GPURange:
      type: object
      required: [min, max, default, options]
      properties:
        min: { type: integer }
        max: { type: integer, description: 현재 GPU 할당량으로 쓸 수 있는 최대 개수. options 중 이보다 큰 값은 아직 고를 수 없다 }
        options:
          type: array
          description: 서비스가 제공하는 GPU 수
          items: { type: integer }
          example: [1, 2, 4]
        default: { type: integer, description: 입력하지 않았을 때 프론트가 보내는 값 }

    TrainingOptions:
      type: object
      required: [strategies, defaultStrategy, gpus, datasetFormat, hyperparameters, limits, checkpoint]
      properties:
        strategies:
          type: array
          items:
            type: object
            required: [name, minGpus, checkpointFormat]
            properties:
              name: { type: string, example: fsdp }
              minGpus: { type: integer, example: 2 }
              checkpointFormat: { type: string, example: fsdp-dcp }
        defaultStrategy: { type: string, example: fsdp }
        gpus: { $ref: "#/components/schemas/GPURange" }
        datasetFormat: { type: string, example: text-jsonl }
        hyperparameters:
          type: array
          items:
            type: object
            required: [key, level, type, default]
            properties:
              key: { type: string, example: epochs }
              level: { type: string, enum: [basic, advanced] }
              type: { type: string, enum: [integer, number] }
              nullable: { type: boolean, description: "null을 보내면 기본값을 지운다 (max_steps)" }
              default: { type: number, nullable: true, example: 10 }
              min: { type: number }
              exclusiveMin: { type: number }
              max: { type: number }
        limits:
          type: object
          required: [maxModelBytes, maxDataBytes, maxFiles]
          properties:
            maxModelBytes: { type: integer, format: int64 }
            maxDataBytes: { type: integer, format: int64 }
            maxFiles: { type: integer }
        checkpoint:
          type: object
          description: "간격 미리보기용. τ = √(2·C·M), C = 모델 바이트 · sizeFactor / writeBytesPerSecond, 최소 minIntervalSeconds"
          required: [sizeFactor, writeBytesPerSecond, mtbfSeconds, minIntervalSeconds]
          properties:
            sizeFactor: { type: number, example: 3 }
            writeBytesPerSecond: { type: number, example: 100000000 }
            mtbfSeconds: { type: number, example: 21600 }
            minIntervalSeconds: { type: number, example: 300 }

    SubmitSpec:
      type: object
      additionalProperties: false
      required: [gpus]
      properties:
        name: { type: string, description: "1~63자, 소문자 · 숫자 · `-`. 없으면 `{모델 폴더명}-{id}`", example: gpt2-demo }
        strategy: { type: string, description: 없으면 defaultStrategy, example: fsdp }
        gpus: { type: integer, example: 2 }
        hyperparameters:
          type: object
          description: options의 hyperparameters 키만. 비우면 기본값
          additionalProperties: true
          example: { epochs: 3 }

    TrainConfig:
      type: object
      description: 최종 config.json. 키는 snake_case 그대로다.
      required: [schema_version, model, training_mode, checkpoint_format, dataset, epochs, max_steps, batch_size_per_gpu, learning_rate, warmup_steps, seed, world_size, checkpoint_policy]
      properties:
        schema_version: { type: integer, example: 2 }
        model: { type: string, example: gpt2 }
        training_mode: { type: string, example: fsdp }
        checkpoint_format: { type: string, example: fsdp-dcp }
        dataset:
          type: object
          required: [uri, format, manifest_sha256]
          properties:
            uri: { type: string }
            format: { type: string, example: text-jsonl }
            manifest_sha256: { type: string }
        epochs: { type: integer, example: 10 }
        max_steps: { type: integer, nullable: true }
        batch_size_per_gpu: { type: integer, example: 4 }
        learning_rate: { type: number, example: 0.00003 }
        warmup_steps: { type: integer, example: 100 }
        seed: { type: integer, example: 42 }
        world_size: { type: integer, example: 2 }
        checkpoint_policy:
          type: object
          description: "Young/Daly 간격. train.py가 처음 warmup_measure_steps step의 시간을 재서 step 간격으로 바꾼다"
          required: [interval_seconds, estimated_save_seconds, mtbf_seconds, warmup_measure_steps]
          properties:
            interval_seconds: { type: number, example: 844 }
            estimated_save_seconds: { type: number, example: 16.5 }
            mtbf_seconds: { type: number, example: 21600 }
            warmup_measure_steps: { type: integer, example: 20 }

    CreatedJob:
      type: object
      required: [id, name, status, generation, jobsetName, queue, config, configSha256, createdAt]
      properties:
        id: { type: string, example: 3f9a1c2e }
        name: { type: string, example: gpt2-demo }
        status: { $ref: "#/components/schemas/Status" }
        generation: { type: integer, example: 1 }
        jobsetName: { type: string, example: job-3f9a1c2e-g0001 }
        queue: { type: string, example: queue-light }
        config: { $ref: "#/components/schemas/TrainConfig" }
        configSha256: { type: string }
        createdAt: { type: string, format: date-time }

    Status:
      type: string
      enum: [QUEUED, ADMITTED, RUNNING, SUCCEEDED, FAILED, RECOVERING, CANCELLED]
      description: |
        화면에 쓰는 작업 상태. Kafka `job.lifecycle` 사건 기준 (한 세대 안에서는 앞으로만 바뀜).
        - QUEUED: job.submitted
        - ADMITTED: job.admitted · job.placed
        - RUNNING: job.started · job.resumed (Pod 준비 완료)
        - SUCCEEDED · FAILED: job.completed · job.failed
        - RECOVERING: job.fenced (재배치 요청으로 세대를 내림, 다음 세대 대기)
        - CANCELLED: job.stopped (사용자 · Backend 중지)

    Phase:
      type: string
      enum: [Pending, Admitted, Running, Succeeded, Failed]
      description: |
        현재 세대의 관리 클러스터 상태.
        - Pending: 큐에서 승인 대기
        - Admitted: 워커가 쿼터를 잡음
        - Running: active Pod가 있음
        - Succeeded / Failed: JobSet condition 기준

    Job:
      type: object
      required: [id, name, model, strategy, gpus, status, generation, jobsetName, queue, phase, recoveryCount, createdAt, updatedAt, progress]
      properties:
        id: { type: string }
        name: { type: string }
        model: { type: string }
        strategy: { type: string }
        gpus: { type: integer }
        status: { $ref: "#/components/schemas/Status" }
        statusMessage: { type: string, description: "대기 이유 등 Kueue 메시지, 실패 · 재배치 이유" }
        generation: { type: integer }
        jobsetName: { type: string }
        queue: { type: string }
        cluster: { type: string, description: MultiKueue가 고른 EKS. 아직 없으면 생략, example: devoops-a }
        phase: { $ref: "#/components/schemas/Phase" }
        dataset:
          type: object
          required: [id, version]
          properties:
            id: { type: string }
            version: { type: integer }
            format: { type: string }
            manifestSha256: { type: string }
        hyperparameters: { type: object, additionalProperties: true, description: 사용자가 바꾼 값 }
        configSha256: { type: string }
        recoveryCount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        config: { $ref: "#/components/schemas/TrainConfig" }
        images: { type: object, additionalProperties: { type: string } }
        progress:
          description: 첫 job.progress · checkpoint.approved가 오기 전에는 null
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Progress"

    Progress:
      type: object
      description: ckpt-sidecar(rank 0)가 train.py 진행 파일을 약 30초마다 보내는 job.progress의 최신 값. lastCheckpointStep은 checkpoint.approved와 비교해 큰 값
      required: [status, generation, step, totalSteps, loss, lastCheckpointStep, updatedAt]
      properties:
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED], description: "train.py가 쓴 값. 체크포인트 승인만 왔으면 빈 문자열" }
        generation: { type: integer, format: int64 }
        step: { type: integer, format: int64 }
        totalSteps: { type: integer, format: int64 }
        loss: { type: number, format: double }
        lastCheckpointStep: { type: integer, format: int64 }
        nodeName: { type: string }
        updatedAt: { type: string, format: date-time }

    JobEvent:
      type: object
      required: [jobId, key, time, lastTime, cluster, source, reason, message, type, object, count]
      properties:
        jobId: { type: string }
        key: { type: string, description: "정렬 키 `<시각 ms UTC>#<클러스터>#<ID>`. 반복 이벤트는 같은 키를 덮어쓴다" }
        time: { type: string, format: date-time, description: 처음 본 시각 }
        lastTime: { type: string, format: date-time, description: 마지막으로 본 시각 }
        cluster: { type: string, description: "`onprem`(온프레 관리 클러스터) 또는 EKS 워커 이름" }
        source: { type: string, description: "backend, kueue-admission, multikueue, jobset, default-scheduler, karpenter, kubelet, ..." }
        reason: { type: string }
        message: { type: string }
        type: { type: string, enum: [Normal, Warning] }
        object: { type: string, description: "이벤트 대상 `Kind/name`" }
        count: { type: integer, format: int64 }

    File:
      type: object
      required: [kind, name, size]
      properties:
        kind: { type: string, enum: [code, data], description: "code = config.json · jobset.json, data = 업로드한 파일의 manifest.json" }
        name: { type: string }
        size: { type: integer, format: int64 }
