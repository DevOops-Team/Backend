openapi: 3.0.3
info:
  title: DevOops Backend API
  version: 0.5.0
  description: |
    학습 작업을 제출하고 진행 상태를 보는 API. Confluence `서비스 API 명세`를 따른다.

    - 프론트는 로컬의 Hugging Face 모델 폴더 · jsonl 학습 데이터와 설정을 `POST /api/jobs`(multipart)로 제출한다. 기본값과 범위는 `GET /api/training/options`가 준다.
    - 필드 이름은 camelCase다. `hyperparameters` · `config` 안은 config.json 키 그대로 snake_case다.
    - 오류 응답은 `{"error", "code", "fields"}`다. 400은 입력 오류, 413은 업로드 상한 초과, 502는 S3 · 관리 클러스터 · DynamoDB(펜싱) 오류다.
    - 이 파일은 손으로 관리한다. 라우트를 바꾸면 `internal/handler/router.go`와 함께 고친다(테스트가 Gin 라우트와 이 파일을 비교한다).

    상태 · 진행률은 데이터 DB(`gpuf_data`의 `v_job_status`, collector가 Kafka `job.lifecycle`에서 적재)와 관리 클러스터(Kueue · JobSet), 설정은 S3, 나머지는 JobSet 어노테이션에서 읽는다. 제출 기록은 Kafka `job.lifecycle`(`job.submitted`)로 보낸다.
    목록의 `limit` · `cursor`, `generations`, `cancel`은 아직 없다.
servers:
  - url: /
# 인증 없음 (로컬 · 데모용). 인증이 생기면 securitySchemes와 함께 바꾼다.
security: []
tags:
  - name: training
    description: 제출 화면이 고를 수 있는 값
  - name: jobs
    description: 작업 제출 · 조회
  - name: files
    description: 작업이 저장한 파일 보기
  - name: model
    description: 학습이 끝난 작업의 최종 모델 (마지막 승인 체크포인트, ADR-30) 내려받기. 파일은 S3 presigned URL로 직접 받는다
  - name: health
    description: 상태 확인

paths:
  /healthz:
    get:
      tags: [health]
      summary: 상태 확인
      operationId: healthz
      responses:
        "200":
          description: 살아 있음
          content:
            text/plain:
              schema: { type: string, example: ok }

  /api/training/options:
    get:
      tags: [training]
      summary: 방식 · GPU 범위 · 하이퍼파라미터 정의 · 업로드 상한 · 체크포인트 계산 기본값
      operationId: getTrainingOptions
      responses:
        "200":
          description: 제출 화면 옵션
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingOptions" }

  /api/uploads:
    post:
      tags: [jobs]
      summary: 직접 업로드 준비 (presigned PUT)
      operationId: createUpload
      description: |
        브라우저가 학습 입력을 S3에 직접 올리기 위한 URL을 받는다 (GPU-278). devoops.site는 Cloudflare 프록시(요청 본문 100MB 제한)를 거치므로 큰 모델은 `POST /api/jobs` multipart로 올릴 수 없다.

        1. 파일 목록(경로 · 크기 · sha256 hex)을 보낸다. 경로 규칙 · 상한 · 필수 파일은 `POST /api/jobs` multipart 파트 이름과 같다(`model/<폴더>/<경로>`, `data/<파일>.jsonl`, `train/<파일>.py`).
        2. Backend가 `datasets/{id}/v1/manifest.json`을 쓰고 파일마다 presigned PUT URL을 돌려준다. URL에 크기와 sha256이 서명되어 있어 S3가 다른 내용은 거절한다. `headers`는 PUT에 그대로 넣는다.
           큰 파일은 multipart: 요청에 `partBytes`(5MiB~512MiB)와 그 파일의 `parts`(조각마다 sha256)를 넣으면 S3 multipart upload를 시작하고 조각마다 URL(`parts[]`)을 준다. 조각은 순서 · 동시성 상관없이 PUT하고, 실패한 조각만 다시 보내면 된다. S3가 조각마다 sha256을 검증한다(파일 전체 sha256은 manifest에 들어가 ckpt-init이 받을 때 검증).
        3. 모든 PUT이 끝나면 `POST /api/jobs`에 spec `upload: {id}`만 보낸다(파일 파트 없음). Backend가 multipart 파일을 조각 목록 · sha256 확인 뒤 완료(CompleteMultipartUpload)한다. 작업 id는 이 업로드 id가 된다.

        URL은 1시간(또는 Backend Roles Anywhere 세션 만료) 안에 PUT을 시작해야 한다. 제출하지 않은 업로드의 객체는 남는다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
      responses:
        "201":
          description: 업로드 URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413":
          description: 업로드 상한(모델 · 데이터 바이트, 파일 수) 초과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/jobs:
    post:
      tags: [jobs]
      summary: 작업 제출
      operationId: createJob
      description: |
        multipart/form-data. 첫 파트는 `spec`(JSON), 이어서 파일 파트를 보낸다. 파일 경로는 파트 **이름**에 넣는다(파일명은 기본 이름만 남기 때문).
        - `model/<폴더명>/<폴더 안 경로>`: Hugging Face 모델 폴더의 파일 전부 (`config.json` 필수, 한 폴더만)
        - `data/<파일명>.jsonl`: 학습 데이터 (한 줄에 `{"text": ...}`), 1개 이상
        - `train/<파일명>.py`: 학습 코드, 정확히 1개 (최대 1MiB). 파일명과 상관없이 `datasets/{id}/v1/code/train.py`로 저장해 manifest에 넣고, ckpt-init이 Pod의 `/data/code/train.py`로 받아 trainer가 `torchrun`으로 실행한다. trainer 이미지는 학습 환경(torch · transformers)만 담는다. 파일 보기용 사본은 `code/{id}/train.py`

        고정 데이터셋 제출(GPU-200, 잡 투입기): spec에 `dataset`({id, version})을 넣으면 파일 파트 없이 `spec` 파트만 보낸다. 업로드 대신 이미 올려 둔 `datasets/{id}/v{version}/`(manifest에 `model/config.json` · `data/*.jsonl` · `code/train.py`)를 그대로 쓰고, 그 뒤 처리는 같다. 파일 파트가 같이 오거나, 데이터셋 · manifest가 없거나, `code/train.py`가 manifest와 다르면 400.

        직접 업로드 제출(GPU-278): `POST /api/uploads`로 S3에 올린 뒤 spec에 `upload`({id})를 넣고 `spec` 파트만 보낸다. manifest의 파일마다 S3 크기 · sha256(HeadObject 체크섬)을 확인하고, 작업 id는 업로드 id가 된다. 파일이 아직 없거나 다르면 400, 이미 제출한 업로드면 409.

        처리: spec 검증(실패하면 아무것도 읽지 · 쓰지 않음) → 파일을 S3 `datasets/{id}/v1/{model,data,code}/`로 스트리밍(sha256 · 크기 계산, 상한 초과 시 413) → `manifest.json` → 체크포인트 간격 계산(Young/Daly) → `code/{id}/train.py` · `config.json` · `jobset.json` → DynamoDB 펜싱 첫 항목 → JobSet 제출 → Kafka `job.submitted`(최선 노력).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [spec]
              properties:
                spec: { $ref: "#/components/schemas/SubmitSpec" }
              additionalProperties:
                type: string
                format: binary
                description: "`model/<폴더>/<경로>`, `data/<파일>.jsonl` 또는 `train/<파일>.py`"
      responses:
        "201":
          description: 제출됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: 같은 JobSet 이름 · 펜싱 항목이 이미 있음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: 업로드 상한(모델 · 데이터 바이트, 파일 수) 초과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }
    get:
      tags: [jobs]
      summary: 작업 목록 (최신순)
      operationId: listJobs
      description: 관리 클러스터의 JobSet · Workload(이름 · 설정 · 대기 이유)에 데이터 DB `v_job_status`의 상태 · 워커 · 진행률 · 마지막 승인 체크포인트를 합친다. DB에 행이 없거나 DB 장애이면 관리 클러스터 상태를 그대로 쓴다. 상태는 뒤로 가지 않는다(관리 클러스터가 더 앞서 있으면 그 값).
      responses:
        "200":
          description: 작업 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
                  nextCursor: { type: string, nullable: true }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}:
    get:
      tags: [jobs]
      summary: 작업 상세
      operationId: getJob
      description: 목록 항목에 최종 `config`와 사용한 이미지를 더한다.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: 작업
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

    delete:
      tags: [jobs]
      summary: 끝난 작업 삭제 (체크포인트 · 최종 모델 · 업로드 파일 영구 삭제)
      operationId: deleteJob
      description: |
        성공 · 실패 · 취소된 작업만 지운다. S3 `jobs/<id>/`(체크포인트 · 최종 모델), `code/<id>/`, `datasets/<id>/` 아래를
        **모든 버전과 삭제 표시까지** 지운 뒤(버킷 버전 관리 켜짐, 되돌릴 수 없음) 모든 세대의 JobSet을 지워 목록에서 뺀다.
        S3 단계가 실패하면 JobSet은 남으므로 다시 요청하면 된다. 데이터 DB 기록(지표 이력)은 남긴다.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "204": { description: 삭제함 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotFinished" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}/stop:
    post:
      tags: [jobs]
      summary: 학습 중단 (사용자 요청)
      operationId: stopJob
      description: |
        대기 · 입장 · 실행 중(QUEUED · ADMITTED · RUNNING)인 작업을 멈춘다. 끝나지 않은 JobSet마다 주석
        `devoops/stop-reason: user` · `devoops/stop-requested-at`(RFC 3339 UTC)을 단 뒤 지운다(Background 전파 →
        Workload · Job · 워커 쪽 복사본 정리). 감시기가 이 주석을 보고 `job.cancelled`를 보내면 데이터 DB 상태가
        CANCELLED가 되고, 그 전까지 작업 상태는 STOPPING이다. JobSet이 없어도 작업은 목록에 남는다(S3 `code/<id>/jobset.json` +
        데이터 DB). 이미 STOPPING이면 아무것도 하지 않고 202.
        - 409 `RECOVERING`: 재배치 중(다음 세대를 재배치 실행기가 곧 만듦). 다시 실행된 뒤 중단한다.
        - 409 `FINISHED`: 이미 끝남 (SUCCEEDED · FAILED · CANCELLED)
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "202": { description: "중단함 (JobSet 삭제, 종료 사건 대기)" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 재배치 중(code RECOVERING)이거나 이미 끝남(code FINISHED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}/restart:
    post:
      tags: [jobs]
      summary: 학습 다시 시작 (중단한 작업을 마지막 승인 체크포인트부터)
      operationId: restartJob
      description: |
        사용자가 중단한(CANCELLED) 작업을 세대 +1로 다시 제출한다 (GPU-240). DynamoDB 펜싱 항목을 세대 N → N+1로
        조건부 갱신하고(복구 진행 중이 아닐 때만, owner 제거) S3 `code/<id>/jobset.json`에서 이름 · 세대만 바꾼
        `job-<id>-g<N+1>`을 제출한다. 큐 · 우선순위는 처음 제출과 같고 주석 `devoops/restart-reason: user` ·
        `devoops/restart-requested-at`(RFC 3339 UTC)이 붙는다. 새 세대의 ckpt-init이 승인된 체크포인트를 받아
        그 다음 step부터 학습한다(승인본이 없으면 처음부터). 감시기가 새 세대 `job.submitted` · `job.resumed`를 보낸다.
        펜싱만 올라가고 제출이 실패했으면 다시 요청하면 제출만 한다.
        - 409 `STOPPING`: 아직 중단 중 (종료 사건 대기). 중단됨이 된 뒤 다시 요청한다.
        - 409 `NOT_STOPPED`: 대기 · 실행 · 재배치 중 (QUEUED · ADMITTED · RUNNING · RECOVERING)
        - 409 `FINISHED`: 끝난 작업 (SUCCEEDED · FAILED)
        - 409 `GENERATION_MOVED`: 펜싱 항목의 세대가 다르거나 복구가 진행 중
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "202": { description: "다시 제출함 (새 세대 대기열)" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 다시 시작할 수 없는 상태 (code STOPPING · NOT_STOPPED · FINISHED · GENERATION_MOVED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}/events:
    get:
      tags: [jobs]
      summary: 전달 타임라인 (시간순)
      operationId: listJobEvents
      description: 작업이 GPU까지 가는 동안 거친 단계. 온프레 관리 클러스터(`onprem`) 단계는 백엔드가 Kubernetes Event · Kueue Workload에서 모은다.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: 이벤트 목록 (없으면 빈 배열)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}/files:
    get:
      tags: [files]
      summary: 작업 파일 목록 (config.json · jobset.json · train.py · 데이터 manifest.json)
      operationId: listJobFiles
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: 파일 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/File" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}/files/{kind}/{name}:
    get:
      tags: [files]
      summary: 파일 내용 (앞 64KiB)
      operationId: getJobFile
      description: "`data`는 `manifest.json`만 된다. 체크포인트는 보여 주지 않는다."
      parameters:
        - $ref: "#/components/parameters/JobID"
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [code, data] }
        - name: name
          in: path
          required: true
          description: 파일명 (경로 구분자 없이)
          schema: { type: string, example: config.json }
      responses:
        "200": { $ref: "#/components/responses/FileText" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}/model:
    get:
      tags: [model]
      summary: 학습 완료 모델 정보
      operationId: getTrainedModel
      description: |
        학습이 끝난(SUCCEEDED) 작업의 마지막 승인 체크포인트(data.checkpoints)와 그 manifest.json의 파일 목록.
        파일은 S3 `jobs/<id>/gen-NNNN/step-NNNNNNNN/` 아래에 있다.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: 최종 모델
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainedModel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotFinished" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/jobs/{id}/model/files/{name}:
    get:
      tags: [model]
      summary: 학습 완료 모델 파일 하나 (S3 presigned URL로 이동)
      operationId: downloadTrainedModelFile
      description: |
        누를 때마다 15분짜리 presigned GET URL을 만들어 302로 보낸다. 브라우저는 S3에서 직접 받고,
        파일 이름은 URL의 response-content-disposition으로 정해진다. S3는 받기 시작할 때만 서명을 확인한다.
      parameters:
        - $ref: "#/components/parameters/JobID"
        - name: name
          in: path
          required: true
          description: manifest.json에 있는 파일명만 된다
          schema: { type: string, example: __0_0.distcp }
      responses:
        "302":
          description: S3 presigned URL로 이동
          headers:
            Location:
              schema: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotFinished" }
        "502": { $ref: "#/components/responses/BadGateway" }

components:
  parameters:
    JobID:
      name: id
      in: path
      required: true
      description: 작업 ID (백엔드가 만든 8자리 hex)
      schema: { type: string, pattern: "^[0-9a-z]+$", example: 3f9a1c2e }

  responses:
    FileText:
      description: 파일 앞부분
      headers:
        X-Truncated:
          description: 64KiB에서 잘렸으면 true
          schema: { type: boolean }
        X-Total-Size:
          description: 전체 크기 (바이트)
          schema: { type: integer, format: int64 }
      content:
        text/plain:
          schema: { type: string }
    BadRequest:
      description: 입력 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            gpus:
              value:
                error: "invalid request: gpus: 2~2"
                code: VALIDATION
                fields: [{ field: gpus, message: "2~2" }]
    NotFound:
      description: 없음
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFinished:
      description: 학습이 아직 끝나지 않음 (code NOT_FINISHED)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: S3 · 관리 클러스터 · DynamoDB 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [VALIDATION, NOT_FOUND, ALREADY_EXISTS, NOT_FINISHED, TOO_LARGE, SUBMIT_FAILED, UPSTREAM, INTERNAL]
        fields:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: gpus }
              message: { type: string, example: "2~2" }

    GPURange:
      type: object
      required: [min, max, default, options]
      properties:
        min: { type: integer }
        max: { type: integer, description: 학습 요청 한 건에 지정할 수 있는 최대 GPU 개수, example: 4 }
        options:
          type: array
          description: 서비스가 제공하는 GPU 수
          items: { type: integer }
          example: [1, 2, 3, 4]
        default: { type: integer, description: 입력하지 않았을 때 프론트가 보내는 값 }

    TrainingOptions:
      type: object
      required: [strategies, defaultStrategy, finetunes, defaultFinetune, gpus, datasetFormat, hyperparameters, limits, checkpoint, namedDatasets]
      properties:
        strategies:
          type: array
          items:
            type: object
            required: [name, minGpus, checkpointFormat]
            properties:
              name: { type: string, example: fsdp }
              minGpus: { type: integer, example: 1 }
              checkpointFormat: { type: string, example: fsdp-dcp }
        defaultStrategy: { type: string, example: fsdp }
        finetunes:
          type: array
          description: "학습 방식 (GPU-262). full = 모든 파라미터, qlora = 4bit 기본 가중치 + LoRA 어댑터만. strategies에 든 방식에서만 고를 수 있다"
          items:
            type: object
            required: [name, strategies]
            properties:
              name: { type: string, enum: [full, qlora] }
              strategies: { type: array, items: { type: string }, example: [fsdp] }
              lora: { $ref: "#/components/schemas/Lora" }
        defaultFinetune: { type: string, example: full }
        namedDatasets:
          type: array
          description: "학습 이름 → S3 고정 데이터셋 (GPU-160). 화면에서 이 이름을 적으면 모델 · 데이터 · 학습 코드 단계를 건너뛰고 파일 없이 spec.dataset {id, version}으로 제출한다. 브라우저로 올리기엔 큰 모델(14B)용"
          items:
            type: object
            required: [name, id, version]
            properties:
              name: { type: string, example: devoops }
              id: { type: string, example: qwen25-14b-wikitext103 }
              version: { type: integer, example: 1 }
        gpus: { $ref: "#/components/schemas/GPURange" }
        datasetFormat: { type: string, example: text-jsonl }
        hyperparameters:
          type: array
          items:
            type: object
            required: [key, level, type, default]
            properties:
              key: { type: string, example: epochs }
              level: { type: string, enum: [basic, advanced] }
              type: { type: string, enum: [integer, number] }
              nullable: { type: boolean, description: "null을 보내면 기본값을 지운다 (max_steps)" }
              default: { type: number, nullable: true, example: 10 }
              min: { type: number }
              exclusiveMin: { type: number }
              max: { type: number }
        limits:
          type: object
          required: [maxModelBytes, maxDataBytes, maxTrainBytes, maxFiles]
          properties:
            maxModelBytes: { type: integer, format: int64 }
            maxDataBytes: { type: integer, format: int64 }
            maxTrainBytes: { type: integer, format: int64, description: train.py 상한 }
            maxFiles: { type: integer }
        checkpoint:
          type: object
          description: >-
            간격 계산 입력 (GPU-261). τ = √(2·C·M), C = 저장 파라미터 수 · bytesPerParam ÷ 쓰는 Pod 수 ÷ writeBytesPerSecond, 최소 minIntervalSeconds.
            저장 파라미터 수는 full이면 모델 전체, qlora면 LoRA 어댑터(Σ r·(in+out))이고 Backend가 safetensors 헤더의 텐서 모양으로 센다.
            쓰는 Pod 수는 FSDP면 GPU 수, DDP면 1. everySteps가 0보다 크면 τ 대신 그 step마다 저장한다 (GPU-298)
          required: [everySteps, bytesPerParam, writeBytesPerSecond, mtbfSeconds, minIntervalSeconds]
          properties:
            everySteps: { type: integer, example: 100, description: "고정 저장 간격(step). 0 = τ 사용" }
            bytesPerParam: { type: number, example: 12, description: "fp32 가중치 4 + Adam 모멘트 8" }
            writeBytesPerSecond: { type: number, example: 100000000 }
            mtbfSeconds: { type: number, example: 21600 }
            minIntervalSeconds: { type: number, example: 300 }

    UploadRequest:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        partBytes: { type: integer, format: int64, description: "multipart 조각 크기 (5MiB~512MiB). parts가 있는 파일이 있으면 필수", example: 67108864 }
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, size, sha256]
            properties:
              path: { type: string, description: "`model/<폴더>/<경로>`, `data/<파일>.jsonl` 또는 `train/<파일>.py`", example: model/gpt2/config.json }
              size: { type: integer, format: int64, example: 665 }
              sha256: { type: string, description: 파일 내용의 SHA-256 (소문자 hex 64자), example: 0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9 }
              parts:
                type: array
                items: { type: string }
                description: "multipart로 올릴 때 조각마다 SHA-256 hex. 조각 i = [i·partBytes, (i+1)·partBytes). 개수 = ⌈size/partBytes⌉ (2개 이상)"
    UploadTicket:
      type: object
      required: [id, expiresAt, files]
      properties:
        id: { type: string, description: 업로드 id = 제출하면 작업 id, example: a1b2c3d4 }
        expiresAt: { type: string, format: date-time }
        files:
          type: array
          items:
            type: object
            required: [path]
            description: 한 번 PUT(url · headers) 또는 multipart(parts) 중 하나
            properties:
              path: { type: string, example: model/gpt2/config.json }
              url: { type: string, description: presigned PUT URL (S3) }
              headers:
                type: object
                additionalProperties: { type: string }
                description: "PUT에 그대로 넣을 헤더 (`x-amz-checksum-sha256`)"
              parts:
                type: array
                items:
                  type: object
                  required: [number, size, url, headers]
                  properties:
                    number: { type: integer, example: 1 }
                    size: { type: integer, format: int64, example: 67108864 }
                    url: { type: string, description: presigned UploadPart URL }
                    headers: { type: object, additionalProperties: { type: string } }
    SubmitSpec:
      type: object
      additionalProperties: false
      required: [gpus]
      properties:
        name: { type: string, description: "1~63자, 소문자 · 숫자 · `-`. 없으면 `{모델 폴더명}-{id}`", example: gpt2-demo }
        strategy: { type: string, description: 없으면 defaultStrategy, example: fsdp }
        finetune:
          type: string
          enum: [full, qlora]
          description: >-
            학습 방식 (GPU-262). 없으면 defaultFinetune. qlora는 FSDP에서만, 모델 폴더에 safetensors가 있어야 한다(어댑터 크기 계산).
            train.py가 config.json `finetune`을 읽어야 하며 기본 train.py(`fit()`)는 full만 한다
          example: qlora
        gpus: { type: integer, example: 2 }
        hyperparameters:
          type: object
          description: options의 hyperparameters 키만. 비우면 기본값
          additionalProperties: true
          example: { epochs: 3 }
        exp_id:
          type: string
          description: >-
            실험 ID (잡 투입기, GPU-172). 선택. job.submitted payload `exp_id`와 JobSet 주석 `devoops/exp-id`로 넘겨
            collector가 실험과 잡을 잇는다. 투입기 · 데이터 DB와 같은 이름이라 snake_case다
          example: exp-20261116-a
        upload:
          type: object
          additionalProperties: false
          required: [id]
          description: "`POST /api/uploads`로 S3에 직접 올린 입력으로 제출 (GPU-278). 파일 파트 없이 보낸다. dataset과 함께 쓸 수 없다"
          properties:
            id: { type: string, example: a1b2c3d4 }
        dataset:
          type: object
          additionalProperties: false
          required: [id, version]
          description: >-
            고정 데이터셋 (GPU-200). 주면 파일 파트 없이 `datasets/{id}/v{version}/`을 그대로 쓴다. id는 '-'를 1개 이상 포함해
            학습 ID(작업마다 올린 데이터셋, 학습 삭제 때 같이 지워짐)와 겹치지 않는다
          properties:
            id: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$", example: smollm2-wikitext2 }
            version: { type: integer, minimum: 1, example: 1 }

    TrainConfig:
      type: object
      description: 최종 config.json. 키는 snake_case 그대로다.
      required: [schema_version, model, training_mode, checkpoint_format, dataset, epochs, max_steps, batch_size_per_gpu, learning_rate, warmup_steps, seed, world_size, checkpoint_policy, finetune]
      properties:
        schema_version: { type: integer, example: 4, description: "4: checkpoint_policy.every_steps 추가 (GPU-298). 3: finetune 추가 (GPU-262). trainer 하네스는 2 · 3 · 4를 모두 받는다" }
        model: { type: string, example: gpt2 }
        training_mode: { type: string, example: fsdp }
        checkpoint_format: { type: string, example: fsdp-dcp }
        dataset:
          type: object
          required: [uri, format, manifest_sha256]
          properties:
            uri: { type: string }
            format: { type: string, example: text-jsonl }
            manifest_sha256: { type: string }
        epochs: { type: integer, example: 10 }
        max_steps: { type: integer, nullable: true }
        batch_size_per_gpu: { type: integer, example: 4 }
        learning_rate: { type: number, example: 0.00003 }
        warmup_steps: { type: integer, example: 100 }
        seed: { type: integer, example: 42 }
        world_size: { type: integer, example: 2 }
        checkpoint_policy:
          type: object
          description: "every_steps가 0보다 크면 그 step마다 저장(GPU-298, 기본 100). 0이면 Young/Daly 간격: train.py가 처음 warmup_measure_steps step의 시간을 재서 step 간격으로 바꾼다"
          required: [every_steps, interval_seconds, estimated_save_seconds, mtbf_seconds, warmup_measure_steps]
          properties:
            every_steps: { type: integer, example: 100, description: "고정 저장 간격(step). 0 = Young/Daly 간격 사용" }
            interval_seconds: { type: number, example: 590 }
            estimated_save_seconds: { type: number, example: 8.1 }
            mtbf_seconds: { type: number, example: 21600 }
            warmup_measure_steps: { type: integer, example: 20 }
        finetune:
          type: object
          required: [method, lora]
          properties:
            method: { type: string, enum: [full, qlora] }
            lora:
              type: object
              allOf: [{ $ref: "#/components/schemas/Lora" }]
              nullable: true
              description: full이면 null

    Lora:
      type: object
      description: LoRA 어댑터 설정 (peft LoraConfig). Backend 설정 finetune_methods.qlora.lora
      required: [r, alpha, dropout, target_modules]
      properties:
        r: { type: integer, example: 16 }
        alpha: { type: integer, example: 32 }
        dropout: { type: number, example: 0.05 }
        target_modules:
          type: array
          items: { type: string }
          example: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

    CreatedJob:
      type: object
      required: [id, name, status, generation, jobsetName, queue, config, configSha256, createdAt]
      properties:
        id: { type: string, example: 3f9a1c2e }
        name: { type: string, example: gpt2-demo }
        status: { $ref: "#/components/schemas/Status" }
        generation: { type: integer, example: 1 }
        jobsetName: { type: string, example: job-3f9a1c2e-g0001 }
        queue: { type: string, example: queue-light }
        config: { $ref: "#/components/schemas/TrainConfig" }
        configSha256: { type: string }
        createdAt: { type: string, format: date-time }

    Status:
      type: string
      enum: [QUEUED, ADMITTED, RUNNING, SUCCEEDED, FAILED, RECOVERING, CANCELLED, STOPPING]
      description: |
        화면에 쓰는 작업 상태. 데이터 DB `v_job_status.state` 기준 (PENDING → QUEUED, FENCED → RECOVERING, STOPPED · CANCELLED → CANCELLED)이며 한 세대 안에서는 앞으로만 바뀜.
        - QUEUED: job.submitted
        - ADMITTED: job.admitted · job.placed
        - RUNNING: job.started · job.resumed (Pod 준비 완료)
        - SUCCEEDED · FAILED: job.completed · job.failed
        - RECOVERING: job.fenced (재배치 요청으로 세대를 내림, 다음 세대 대기)
        - CANCELLED: job.stopped · job.cancelled (사용자 · Backend 중지)
        - STOPPING: 중단 요청으로 JobSet을 지웠고 종료 사건이 아직 데이터 DB에 없음 (POST /api/jobs/{id}/stop)

    Phase:
      type: string
      enum: [Pending, Admitted, Running, Succeeded, Failed]
      description: |
        현재 세대의 관리 클러스터 상태.
        - Pending: 큐에서 승인 대기
        - Admitted: 워커가 쿼터를 잡음
        - Running: active Pod가 있음
        - Succeeded / Failed: JobSet condition 기준

    Job:
      type: object
      required: [id, name, model, strategy, gpus, status, generation, jobsetName, queue, phase, recoveryCount, createdAt, updatedAt, progress]
      properties:
        id: { type: string }
        name: { type: string }
        model: { type: string }
        strategy: { type: string }
        finetune: { type: string, enum: [full, qlora], description: "학습 방식 (GPU-262). 그 전에 제출한 작업은 생략 = full" }
        gpus: { type: integer }
        status: { $ref: "#/components/schemas/Status" }
        statusMessage: { type: string, description: "대기 이유 등 Kueue 메시지, 실패 · 재배치 이유" }
        generation: { type: integer }
        jobsetName: { type: string }
        queue: { type: string }
        cluster: { type: string, description: MultiKueue가 고른 EKS. 아직 없으면 생략, example: devoops-a }
        phase: { $ref: "#/components/schemas/Phase" }
        dataset:
          type: object
          required: [id, version]
          properties:
            id: { type: string }
            version: { type: integer }
            format: { type: string }
            manifestSha256: { type: string }
        hyperparameters: { type: object, additionalProperties: true, description: 사용자가 바꾼 값 }
        configSha256: { type: string }
        recoveryCount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        config: { $ref: "#/components/schemas/TrainConfig" }
        images: { type: object, additionalProperties: { type: string } }
        progress:
          description: 첫 job.progress · checkpoint.approved가 오기 전에는 null
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Progress"

    Progress:
      type: object
      description: ckpt-sidecar(rank 0)가 train.py 진행 파일을 약 30초마다 보내는 job.progress의 최신 값. lastCheckpointStep은 checkpoint.approved와 비교해 큰 값
      required: [status, generation, step, totalSteps, loss, lastCheckpointStep, updatedAt]
      properties:
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED, STOPPED], description: "train.py가 쓴 값 (STOPPED: 중단 · SIGTERM으로 사이드카가 마지막으로 쓴 값, GPU-231). 체크포인트 승인만 왔으면 빈 문자열" }
        generation: { type: integer, format: int64 }
        step: { type: integer, format: int64 }
        totalSteps: { type: integer, format: int64 }
        loss: { type: number, format: double }
        lastCheckpointStep: { type: integer, format: int64 }
        nodeName: { type: string }
        updatedAt: { type: string, format: date-time }

    JobEvent:
      type: object
      required: [jobId, key, time, lastTime, cluster, source, reason, message, type, object, count]
      properties:
        jobId: { type: string }
        key: { type: string, description: "정렬 키 `<시각 ms UTC>#<클러스터>#<ID>`. 반복 이벤트는 같은 키를 덮어쓴다" }
        time: { type: string, format: date-time, description: 처음 본 시각 }
        lastTime: { type: string, format: date-time, description: 마지막으로 본 시각 }
        cluster: { type: string, description: "`onprem`(온프레 관리 클러스터) 또는 EKS 워커 이름" }
        source: { type: string, description: "backend, kueue-admission, multikueue, jobset, default-scheduler, karpenter, kubelet, ..." }
        reason: { type: string }
        message: { type: string }
        type: { type: string, enum: [Normal, Warning] }
        object: { type: string, description: "이벤트 대상 `Kind/name`" }
        count: { type: integer, format: int64 }

    File:
      type: object
      required: [kind, name, size]
      properties:
        kind: { type: string, enum: [code, data], description: "code = config.json · jobset.json, data = 업로드한 파일의 manifest.json" }
        name: { type: string }
        size: { type: integer, format: int64 }

    TrainedModel:
      type: object
      required: [jobId, generation, step, format, worldSize, sizeBytes, approvedAt, files]
      properties:
        jobId: { type: string }
        generation: { type: integer, description: 마지막 체크포인트를 저장한 세대 }
        step: { type: integer, format: int64 }
        format: { type: string, example: fsdp-dcp, description: "학습 방식의 checkpoint_format (fsdp-dcp · ddp-pt)" }
        worldSize: { type: integer, description: 저장한 GPU 수 }
        sizeBytes: { type: integer, format: int64 }
        approvedAt: { type: string, format: date-time }
        files:
          type: array
          items:
            type: object
            required: [name, size, sha256]
            properties:
              name: { type: string }
              size: { type: integer, format: int64 }
              sha256: { type: string }
