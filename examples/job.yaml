# 단일 GPU 예시 (g4dn.xlarge 1대 × GPU 1개). 백엔드가 이름·namespace·큐 라벨·S3 볼륨·affinity·toleration을 채운다.
# 여기에는 학습에 필요한 것만 쓴다.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: single-gpu-example # 백엔드가 job-<id>로 바꾼다
spec:
  failurePolicy:
    maxRestarts: 3 # 노드를 잃으면 JobSet을 다시 띄워 standby 노드로 옮긴다 (생략하면 백엔드가 3을 넣는다)
  replicatedJobs:
  - name: trainer
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          spec:
            restartPolicy: Never
            containers:
            - name: trainer
              image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
              command: ["bash", "-c"]
              args:
              - pip install -q boto3 && python "${CODE_DIR}/train.py" --total-steps 5000 --ckpt-every 1000
              env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              resources:
                requests:
                  cpu: "3"
                  memory: 12Gi
                  nvidia.com/gpu: 1
                limits:
                  memory: 12Gi
                  nvidia.com/gpu: 1
